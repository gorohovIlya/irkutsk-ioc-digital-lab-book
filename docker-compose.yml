services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eln_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eln_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eln_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eln_user} -d ${POSTGRES_DB:-eln_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eln_user}:${POSTGRES_PASSWORD:-eln_dev_password}@db:5432/${POSTGRES_DB:-eln_db}
    volumes:
      - ./backend/src:/app/src
    command: .venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload


  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  postgres_data:
